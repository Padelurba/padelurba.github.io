<style>
html,body{margin:0;height:100%;background:#1f5fbf}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
iframe{display:block;border:0;width:100%;height:100%}
#splash{position:fixed;inset:0;z-index:5;color:#fff;font-family:Archivo,system-ui,sans-serif;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;background:radial-gradient(120% 70% at 50% 42%,#2a6fd3 0%,#1f5fbf 38%,#123f86 78%,#0b2a5c 100%);transition:opacity .4s ease}
#splash.out{opacity:0;pointer-events:none}
#splash h1{margin:0 0 34px;font-weight:900;font-style:italic;font-stretch:118%;text-transform:uppercase;font-size:3.1rem;letter-spacing:-.01em;line-height:.95;text-shadow:0 6px 24px rgba(5,20,50,.35);animation:spIn .7s ease both}
#splash h1 span{display:block;color:#cfee2f}
#splash .tile{position:relative;width:150px;height:150px;border-radius:38px;background:linear-gradient(145deg,#e4f76a 0%,#cfee2f 45%,#a9c71c 100%);box-shadow:0 22px 50px rgba(4,18,48,.45),0 0 0 10px rgba(207,238,47,.08),inset 0 2px 0 rgba(255,255,255,.55);display:grid;place-items:center;animation:spIn .7s .1s ease both,spFloat 3s 1s ease-in-out infinite}
#splash .tile svg{width:132px;height:132px}
#splash .bar{position:relative;width:170px;height:5px;margin-top:44px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;animation:spIn .7s .2s ease both}
#splash .bar i{position:absolute;top:0;bottom:0;left:-40%;width:40%;border-radius:99px;background:linear-gradient(90deg,#9fd0ff,#cfee2f);animation:spBar 1.25s ease-in-out infinite}
#splash p{margin:22px 0 0;font-size:.95rem;font-weight:600;opacity:.8;letter-spacing:.05em;animation:spIn .7s .3s ease both}
@keyframes spBar{0%{left:-40%}100%{left:100%}}
@keyframes spIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}#splash .bar i{left:30%}}
</style>
</head>
<body>
<div id="splash"><h1>Pádel<span>Urba</span></h1><div class="tile"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="spf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3ebf6"/></linearGradient><clipPath id="sph"><path d="M60 6C80 6 96 15 96 31C96 46 83 61 70.5 73.5C66 77.5 63 78.5 60 78.5C57 78.5 54 77.5 49.5 73.5C37 61 24 46 24 31C24 15 40 6 60 6Z" transform="translate(60 33) scale(.74) translate(-60 -33)"/></clipPath><pattern id="spp" width="4.7" height="8.14" patternUnits="userSpaceOnUse" x="23.65" y="9.9"><circle cx="1.18" cy="2.04" r="1.15" fill="#1f5fbf"/><circle cx="3.53" cy="6.11" r="1.15" fill="#1f5fbf"/></pattern></defs><g transform="translate(1 7)"><path d="M10 64A50 13 0 0 1 110 64" transform="rotate(14 60 64)" fill="none" stroke="#0d2f66" stroke-width="3.2" stroke-linecap="round"/><g transform="translate(60 62) rotate(38) scale(.8) translate(-60 -66)"><rect x="54.5" y="83" width="11" height="30" rx="2.5" fill="#0d2f66"/><g stroke="rgba(255,255,255,.3)" stroke-width="1.3" stroke-linecap="round"><path d="M55 90L65 86.8"/><path d="M55 94L65 90.8"/><path d="M55 98L65 94.8"/><path d="M55 102L65 98.8"/><path d="M55 106L65 102.8"/><path d="M55 110L65 106.8"/></g><rect x="53" y="111" width="14" height="5" rx="2.5" fill="#0d2f66"/><path d="M60 6C80 6 96 15 96 31C96 46 83 61 70.5 73.5L66.5 85H53.5L49.5 73.5C37 61 24 46 24 31C24 15 40 6 60 6Z M60 74L56.6 81.5H63.4Z" fill="#ffffff" fill-rule="evenodd" stroke="#0d2f66" stroke-width="1.6" stroke-linejoin="round"/><path d="M60 6C80 6 96 15 96 31C96 46 83 61 70.5 73.5C66 77.5 63 78.5 60 78.5C57 78.5 54 77.5 49.5 73.5C37 61 24 46 24 31C24 15 40 6 60 6Z" transform="translate(60 37) scale(.86) translate(-60 -37)" fill="url(#spf)"/><rect x="20" y="8" width="80" height="62" fill="url(#spp)" clip-path="url(#sph)"/><path d="M29 25C32 15 44 9.6 58 9.2" fill="none" stroke="rgba(31,95,191,.35)" stroke-width="1.8" stroke-linecap="round"/></g><path d="M10 64A50 13 0 0 0 110 64" transform="rotate(14 60 64)" fill="none" stroke="#0d2f66" stroke-width="3.2" stroke-linecap="round"/><circle cx="27" cy="24" r="8.5" fill="#1f5fbf" stroke="#0d2f66" stroke-width="1.6"/><path d="M20.03 20.43c3.825 1.7000000000000002 5.61 6.12 3.74 10.71M33.97 27.57c-3.825 -1.7000000000000002 -5.61 -6.12 -3.74 -10.71" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/></g></svg></div><div class="bar"><i></i></div><p>Administrador</p></div>
<iframe id="app" title="Pádel Urba" allow="clipboard-write; fullscreen" allowfullscreen></iframe>
<script>
var APP="https://script.google.com/macros/s/AKfycbwMvd-lI5NOr4Jai7kXUjsiniY0q_V_3z_4JmoC4LFVOhPPKWWZOA-Wpg1747S-yGhrzg/exec";
var dev="";
try{dev=localStorage.getItem("padel-dev")||"";}catch(e){}
if(!/^[0-9a-f]{32}$/.test(dev)){var a=new Uint8Array(16);crypto.getRandomValues(a);dev=Array.prototype.map.call(a,function(b){return("0"+b.toString(16)).slice(-2)}).join("");try{localStorage.setItem("padel-dev",dev)}catch(e){}}
var q=new URLSearchParams(location.search),p=new URLSearchParams();
var key=q.get("admin")||"";
try{if(key)localStorage.setItem("padel-admin",key);else key=localStorage.getItem("padel-admin")||"";}catch(e){}
if(key)p.set("admin",key);
p.set("d",dev);
var t0=Date.now(),sp=document.getElementById("splash"),hid=false;
function hide(){if(hid)return;hid=true;setTimeout(function(){sp.className="out";setTimeout(function(){sp.style.display="none"},400)},Math.max(0,900-(Date.now()-t0)))}
document.getElementById("app").addEventListener("load",function(){setTimeout(hide,300)});
setTimeout(hide,15000);
window.addEventListener("message",function(e){if(e.data&&e.data.padel==="fullscreen"){var d=document;try{if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d)}else{var el=d.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}}catch(x){}}});
document.getElementById("app").src=APP+"?"+p.toString();
</script>
